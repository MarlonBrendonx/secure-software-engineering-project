# Dois contêineres separados: billing-api (backend) e billing-web (interface + Nginx/HTTPS).
#   docker compose up -d --build
# Demonstração (login simulado, senha demo123):  BILLING_DEMO=1 docker compose up -d --build

services:
  billing-api:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: billing-api
    container_name: billing-api
    env_file:
      - path: .env
        required: false
    environment:
      BILLING_DEMO: ${BILLING_DEMO:-0}
    volumes: [api-dados:/dados]
    restart: unless-stopped
    # Sem "ports": a API só é alcançável pelo contêiner web, dentro da rede do compose

  billing-web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: billing-web
    container_name: billing-web
    environment:
      BILLING_API_URL: http://billing-api:8000
      BILLING_PORTA_HTTPS: ${BILLING_PORTA_HTTPS:-443}
    ports:
      - "${BILLING_PORTA_HTTPS:-443}:443"
      - "${BILLING_PORTA_HTTP:-80}:80"
    volumes:
      - web-certs:/certs
      # Para restringir às faixas da VPN com o seu próprio arquivo:
      # - ./infra/nginx/rede-permitida.conf:/etc/nginx/rede-permitida.conf:ro
    depends_on:
      billing-api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  api-dados:
  web-certs:
