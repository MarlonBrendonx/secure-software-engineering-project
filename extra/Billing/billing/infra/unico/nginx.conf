user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    server {
        listen 80;
        include /etc/nginx/rede-permitida.conf;
        return 301 https://$host__SUFIXO_PORTA__$request_uri;
    }

    server {
        listen 443 ssl http2;   # sintaxe aceita pelo nginx 1.24 do Ubuntu 24.04

        ssl_certificate     /dados/certs/billing.crt;
        ssl_certificate_key /dados/certs/billing.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        include /etc/nginx/rede-permitida.conf;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        client_max_body_size 1m;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location / {
            root /usr/share/billing;
            try_files $uri /index.html;
        }
    }
}
