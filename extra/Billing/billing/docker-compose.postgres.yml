# Complemento opcional: PostgreSQL e Redis em contêineres próprios, para várias instâncias da API.
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
# Defina POSTGRES_PASSWORD no arquivo .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  billing-api:
    environment:
      BILLING_DATABASE_URL: postgresql+psycopg://billing:${POSTGRES_PASSWORD}@db:5432/billing
      BILLING_LIMITADOR_TIPO: redis
      BILLING_REDIS_URL: redis://redis:6379/0
      BILLING_WORKERS: "4"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  dbdata:
