server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Anexos (módulo 3) podem ter até 25 MB.
    client_max_body_size 26m;

    # API: o navegador fala com uma origem só (cookies HttpOnly + SameSite=Strict, sem CORS).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Cabeçalhos de segurança da API vêm da própria API.
    }

    location = /health/live { proxy_pass http://api:8000; }
    location = /health/ready { proxy_pass http://api:8000; }

    # Arquivos do build têm hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/seguranca.inc;
    }

    # Rotas do React (/usuarios, /login/verificacao...) caem no index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/seguranca.inc;
    }
}
