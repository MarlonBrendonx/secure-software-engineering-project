[project]
name = "network-billing-backend"
version = "0.1.0"
description = "Sistema interno de faturamento da rede credenciada"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "pyotp>=2.9",
  "segno>=1.6",
  "cryptography>=42",
  "email-validator>=2.1",
  "redis>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nbb = "nbb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nbb*"]
