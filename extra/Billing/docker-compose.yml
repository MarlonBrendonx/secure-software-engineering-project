# Billing completo em containers: só precisa do Docker.
#
#   docker compose up -d --build        sobe tudo (a 1ª vez demora uns minutos)
#   http://localhost:8080               sistema
#
# Configuração opcional em backend/.env (provedores de login, chaves, etc.).
# Sem .env, as chaves são geradas na primeira subida e guardadas no volume "segredos".

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nbb_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: nbb
    # Só no próprio computador (para ferramentas como DBeaver/psql); não fica exposto na rede.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbb_owner -d nbb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    # Estes valores valem sobre o .env: dentro da rede do Docker os nomes são postgres/redis.
    environment:
      NBB_DATABASE_URL: postgresql+psycopg://nbb_app:app@postgres:5432/nbb
      NBB_DATABASE_OWNER_URL: postgresql+psycopg://nbb_owner:owner@postgres:5432/nbb
      NBB_REDIS_URL: redis://redis:6379/0
      NBB_PUBLIC_BASE_URL: ${BILLING_URL:-http://localhost:8080}
      NBB_FRONTEND_URL: ${BILLING_URL:-http://localhost:8080}
      NBB_COOKIE_SECURE: ${BILLING_COOKIE_SECURE:-false}
    volumes:
      - segredos:/segredos
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Sem porta publicada: só o Nginx (web) conversa com a API.

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["${BILLING_PORTA:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  segredos:
