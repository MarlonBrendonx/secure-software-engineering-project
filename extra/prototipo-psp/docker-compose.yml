# Sobe Redis + API + front. Os segredos vêm de backend/.env (copie de .env.example).
services:
  redis:
    image: redis:7-alpine
    # Sem persistência: é um protótipo e os dados são recriados pelo seed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on: [api]
    ports:
      - "3000:3000"
